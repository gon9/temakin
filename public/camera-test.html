<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>手巻きファイター — カメラテスト (M0)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1512;
      color: #f5efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; }
    h1 span { display: block; font-size: 0.8rem; font-weight: normal; color: #b8a88f; margin-top: 4px; }
    button {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: #e0452c;
      color: #fff;
    }
    button:active { transform: scale(0.97); }
    video {
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      background: #000;
      display: none;
    }
    #status { font-size: 0.9rem; color: #b8a88f; min-height: 1.2em; white-space: pre-wrap; }
    #status.error { color: #ff9d8a; }
  </style>
</head>
<body>
  <h1>🍣 手巻きファイター<span>M0: デプロイ＆カメラ起動テスト</span></h1>
  <button id="start">外カメラを起動する</button>
  <video id="preview" playsinline autoplay muted></video>
  <p id="status">ボタンを押すとカメラの使用許可を求めます。映像は端末外に送信されません。</p>
  <script>
    const video = document.getElementById('preview');
    const status = document.getElementById('status');
    const button = document.getElementById('start');

    function fail(message) {
      status.textContent = message;
      status.classList.add('error');
    }

    window.addEventListener('error', (e) => fail('エラー: ' + e.message));

    button.addEventListener('click', async () => {
      status.classList.remove('error');
      status.textContent = 'カメラを起動中…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
          audio: false,
        });
        video.srcObject = stream;
        video.style.display = 'block';
        button.style.display = 'none';
        const track = stream.getVideoTracks()[0];
        const s = track.getSettings();
        status.textContent =
          `カメラOK 🎉 (${s.width}×${s.height} / ${track.label || 'カメラ名不明'})\n` +
          'この画面が見えていればM0クリアです。';
      } catch (err) {
        fail(
          'カメラを起動できませんでした: ' + err.name + '\n' +
          (err.name === 'NotAllowedError'
            ? 'ブラウザのサイト設定でカメラを許可してから再読み込みしてください。'
            : err.message)
        );
      }
    });
  </script>
</body>
</html>
