name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sushi-game-concept-yenbhe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json が現れたら（Vite導入後）ビルドして dist/ を、
      # それまでは静的な public/ をそのまま公開する
      - name: Detect project type
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "dir=public" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.detect.outputs.build == 'true'
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
